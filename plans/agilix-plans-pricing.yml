name: Agilix Labs pricing and plans
description: >-
  Agilix publishes no pricing. There is no /pricing page on www.agilix.com — the URL 404s and
  the sitemap contains no pricing, plans or packages page at all. Every commercial path on the
  site funnels to a contact form: "Request a demo account, start a pilot, or plan an
  implementation." Buzz, TutorKit, Publish Anywhere and Dawn are sold to schools, districts,
  virtual schools, content publishers and channel partners under negotiated licences, and the
  licence itself is modelled inside the API (SystemLicense, GetSystemLicenseCounters,
  License Limit) rather than sold from a page. API access is not separately priced or metered
  publicly; it comes with a provisioned Buzz domain.
