licensing_in_api:
  note: >-
    Licence entitlement is a first-class API object — PutSystemLicense, GetSystemLicense,
    GetSystemLicenseCounters, and the License Limit schema, which "specifies the limit of
    resources an organization can consume". Login fails with NoLicense, LicenseExpired,
    LicenseNotYetValid or LicenseLimitExceeded when entitlement is absent or exhausted. The
    commercial terms behind those limits are not published.
api_metering:
  note: >-
    API usage is governed by per-customer processing-time budgets rather than a priced quota
    (see rate-limits/agilix-rate-limits.yml). Customers "may contact support to increase the
    account's provisioned rate limits"; no price is attached.
