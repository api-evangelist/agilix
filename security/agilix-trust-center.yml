certifications:
- name: SOC 2
  status: examination completed
  scope: security, availability, processing integrity, confidentiality, privacy
  report_public: false
  request_via: security@agilix.com
  evidence: https://www.agilix.com/security
  quote: >-
    "Agilix Labs recently completed its SOC 2 examination, which evaluated our controls
    relevant to security, availability, processing integrity, confidentiality, and privacy."
  note: >-
    No type (I or II), no audit period and no auditor are named on the public page, and no
    date is given for "recently".
claims:
- name: FERPA
  scope: BusyBee (the AI teaching assistant)
  evidence: https://www.agilix.com/llms.txt
  quote: 'Runs on AWS; FERPA compliant; student data is not used to train AI models.'
  note: >-
    Stated in the corporate llms.txt, not on the security page. No FERPA statement covering
    Buzz, TutorKit, Publish Anywhere or Dawn was found.
- name: WCAG accessibility
  evidence: https://www.agilix.com/accessibility
  scope: Buzz and Dawn
not_addressed:
- ISO 27001
- PCI DSS
- HIPAA
- FedRAMP
- GDPR
- COPPA
- Student Privacy Pledge / state student-data-privacy programs
controls_published:
- area: encryption
  detail: PKCS #1 SHA-256 with 2048-bit RSA to secure data at rest and in transit.
- area: identity
  detail: Google authentication and single sign-on through SAML 2.0.
- area: disaster recovery
  detail: Annual testing of recovery processes with multi-location data replication.
- area: infrastructure
  detail: >-
    Runs on AWS; AWS IAM, Shield, KMS, CloudWatch and CloudTrail are named. Agilix is an AWS
    Public Sector Partner (https://www.agilix.com/partners/aws).
- area: shared responsibility
  detail: >-
    The API documentation carries a Shared Security Responsibility section splitting security
    OF Buzz (Agilix) from security IN Buzz (the customer's users, configuration, credentials
    and data), plus a Tenant Isolation topic describing how multitenancy is enforced.
  url: https://api.agilixbuzz.com/docs/entry/Concept/SharedResponsibility.md
- area: audit trail
  detail: >-
    The Data Stream emits a full security audit event class — AuthLoginFailed, AuthMFAFailed,
    AuthAccountLocked/Unlocked, AuthAdminAuthenticated, AuthAdminPasswordChanged,
    AuthProxyLoginStarted/Failed, AuthPasswordRisk, DomainPermissionsCreated/Changed/Deleted,
    OAuthClientKeyAdded/Removed — deliverable to the customer's own SIEM.
  url: https://api.agilixbuzz.com/docs/entry/Concept/DataStream/Overview.md
- area: password policy
  detail: >-
    Per-domain policy covering minimum length, character classes, entropy, breached-password
    checking, expiry, lockout, stale accounts and MFA enforcement, readable through
    GetEffectivePasswordPolicy.
  url: https://api.agilixbuzz.com/docs/entry/Schema/PasswordPolicy.md
