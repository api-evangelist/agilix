method: searched
source: https://www.agilix.com/security
name: Agilix Labs security and compliance posture
description: >-
  Agilix does not operate a hosted trust center — trust.agilix.com, security.agilix.com,
  /trust and /compliance were probed and none exists. What it publishes is a single security
  page on its own marketing site describing infrastructure controls, encryption, disaster
  recovery and a completed SOC 2 examination, with the report and the annual penetration-test
  results available on request rather than openly. For a K-12 vendor handling student data
  that is a thinner public posture than the sector norm, and the omissions are specific:
  FERPA is claimed only for BusyBee in the corporate llms.txt and nowhere on the security
  page, and COPPA, GDPR, ISO 27001 and the state student-data-privacy pledges are not
  addressed anywhere public.
trust_center_url: null
