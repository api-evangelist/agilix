source: https://api.agilixbuzz.com/docs/entry/Concept/SampleCode.md
name: Agilix Buzz API client libraries and sample code
description: >-
  Agilix Labs publishes seven first-party Buzz API client libraries as GitHub repositories
  under the AgilixLabs organization — one per language, each a runnable sample program plus
  a reusable client library that implements the same reference client (OAuth 2.0 JWT client
  credentials, exponential-backoff retries, Retry-After / X-RateLimit-Reset handling, and
  JSON request/response helpers). None of the seven is published to a language package
  registry: npm, PyPI, Packagist, Maven Central, NuGet and the PowerShell Gallery were all
  checked and carry no Agilix/Buzz package, and none of the repositories carries a git tag
  or a GitHub release. Distribution is source-only, at the tip of the default branch, so a
  consumer cannot pin a version.
