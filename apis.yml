apis:
- aid: agilix:buzz-api
  name: Agilix Buzz API (DLAP / xLi)
  description: >-
    The Buzz API is the programmable surface of the Agilix Learning Suite. It is a
    command-style HTTP API rather than a path-and-method REST API: every one of its 291
    documented operations is issued as POST or GET {endpoint}/cmd?cmd=<commandname> with a
    JSON (or XML) envelope in and out, and errors are carried in response.code under an HTTP
    200. It manages domains, users, rights, roles, courses, enrollments, groups, items,
    resources, questions, submissions, teacher responses, gradebooks, objectives,
    announcements, discussions, wikis, licensing and reporting, and exposes a Data Stream of
    about 70 event types deliverable to HTTPS webhooks, Kinesis, Kinesis Firehose, SQS or
    email. Three production endpoint hostnames split workloads by intent — interactive,
    background and a deliberate failure-injection test host — each with its own
    processing-time budget. Authentication is OAuth 2.0 client credentials with an RSA-signed
    JWT client assertion; the legacy Login3 password flow is still supported but not
    recommended for new integrations. No OpenAPI is published.
  humanURL: https://api.agilixbuzz.com/docs/
