aid: agilix
name: Agilix
description: >-
  Agilix Labs, Inc. is a K-12 education technology company in Orem, Utah that builds the
  Agilix Learning Suite — a white-label, multi-tenant set of products schools, districts,
  virtual and online schools and curriculum publishers use to author, deliver and assess
  online and blended learning. The suite is Buzz (the learning management system), TutorKit
  (tutoring program management), Publish Anywhere (LTI-based content distribution to any
  LMS), Dawn (mobile, offline-capable delivery) and BusyBee (an AI teaching assistant built
  into Buzz). Agilix has built learning technology for more than 25 years and reaches
  millions of teachers and students in 20+ languages across 200+ countries, running on AWS.
  Its public developer surface is the Buzz API — also called DLAP or xLi — a command-style
  HTTP API with 291 documented commands covering domains, users, courses, enrollments,
  items, questions, submissions, gradebooks, objectives, rights and licensing, plus a
  configurable Data Stream event feed with roughly 70 event types and five delivery targets
  including HTTPS webhooks. Buzz is a 1EdTech LTI 1.3 / LTI Advantage platform and exchanges
  SCORM run-time data. Authentication is OAuth 2.0 client credentials with a JWT client
  assertion (RFC 6749 + RFC 7523) against an Application Identity account. Agilix publishes
  an llms.txt for both its corporate site and its API documentation, an ai-plugin.json
  manifest on two API hosts, weekly dated release notes, and seven first-party sample client
  libraries on GitHub — but no OpenAPI, no MCP server and no agent card.
