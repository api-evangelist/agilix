entries:
- date: '2026-09-10'
  areas: [Vault, Rights, Password Policies, Authentication, Assessments]
  breaking: false
  highlights:
  - PutKey now reads its parameters from an XML or JSON request body and a POST body is the
    documented way to call it; query-string parameters still work but are deprecated and may
    be rejected in a future release, because the value stored is often a credential and
    query strings land in access, proxy and browser logs.
  - GetRole and ListRoles now resolve "the caller's domain" from the user the session is
    acting as rather than from the token, fixing proxied administrator sessions that were
    refused the acting user's own roles.
  - CheckPasswordQuality, SAML single-logout redirects and custom-question previews were
    corrected the same way, all of which had read the proxying account's domain from the token.
- date: '2026-09-03'
  areas: [Data Streams, Courses, Groups, Schemas]
  breaking: false
  highlights:
  - Corrected which data stream events group changes actually send on Schema 4+ courses, and
    documented the Schema 4 group event payloads publicly.
  - CreateDemoCourse and UpdateCourses now refuse to move a course to schema 4 while it still
    holds groups stored as entities, instead of silently leaving them unreachable.
  - New "Group Inheritance" topic covering how groups, group sets and group-specific activity
    settings inherit from a base course to its derivatives.
