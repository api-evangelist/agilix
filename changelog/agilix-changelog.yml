description: >-
  Agilix publishes dated release notes for the DLAP / Buzz Web Services API as a single
  reference page inside the API documentation, grouped by release date and by functional
  area. Buzz releases weekly. Entries from May 2023 onward — when release notes began being
  published for every release — are grouped by release date; earlier entries are grouped by
  month because release dates before then were not published. The page is long-lived and
  cumulative (roughly 164 KB), and a change appears under the first release on or after the
  day it landed in the API.
