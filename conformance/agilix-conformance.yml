name: Agilix Buzz standards conformance
description: >-
  Standards the Buzz API declares in its own contract surface, with the exact location that
  declares each. The load-bearing finding is the education-domain one: Buzz is a 1EdTech LTI
  1.3 / LTI Advantage PLATFORM, not merely a tool that speaks LTI, and it proves it with a
  live first-party JWKS at https://api.agilixbuzz.com/lti/platform/jwks plus an
  enabledltiservices bitfield in Domain Data whose values are the LTI Advantage service names
  themselves (AGS, NRPS, DL). A district that already speaks LTI integrates its content tools
  with no bespoke connector.
entries:
- id: lti-1.3
  name: 1EdTech Learning Tools Interoperability 1.3
  domain_standard: true
  conforms: true
  role: platform
  evidence: https://api.agilixbuzz.com/docs/entry/Concept/LTIIntegration.md
  evidence_detail: >-
    "Buzz enables LTI integration through the support of LTI Advantage, which includes core
    LTI 1.3, Name and Role Provisioning Services, Deep Linking, and Assignment and Grade
    Services." Platform registration parameters are published: Issuer = the absolute Buzz API
    URL; Key Set URL = /lti/platform/jwks; OpenID Connect Auth URL = /lti/authentication;
    OAuth2 Access Token URL = /lti/accesstoken/{entityid}.
  machine_evidence:
    url: https://api.agilixbuzz.com/lti/platform/jwks
    status: 200
    content: RSA RS256 signing JWKS
    checked: '2026-09-12'
- id: lti-advantage-ags
  name: LTI Advantage — Assignment and Grade Services
  domain_standard: true
  conforms: true
  evidence: https://api.agilixbuzz.com/docs/entry/Enum/LTIServices.md
  evidence_detail: 'enabledltiservices bit 0x1 = AGS ("Assignment and Grade Services is enabled").'
- id: lti-advantage-nrps
  name: LTI Advantage — Names and Role Provisioning Services
  domain_standard: true
  conforms: true
  evidence: https://api.agilixbuzz.com/docs/entry/Enum/LTIServices.md
  evidence_detail: 'enabledltiservices bit 0x2 = NRPS.'
- id: lti-advantage-deep-linking
  name: LTI Advantage — Deep Linking
  domain_standard: true
  conforms: true
  evidence: https://api.agilixbuzz.com/docs/entry/Enum/LTIServices.md
  evidence_detail: 'enabledltiservices bit 0x4 = DL.'
- id: oneroster
  name: 1EdTech OneRoster
  domain_standard: true
  conforms: true
  evidence: https://www.agilix.com/integrations
  evidence_detail: >-
    Named on the integrations page as the 1EdTech standard Buzz uses for "secure automated
    user enrollment and course rostering". Agilix also maintains a 1EdTech partner page at
    https://www.agilix.com/partners/1edtech. Not declared inside the DLAP command reference,
    so the evidence here is the product surface rather than the contract.
  evidence_strength: docs
- id: scorm
  name: SCORM run-time environment
  domain_standard: true
  conforms: true
  evidence: https://api.agilixbuzz.com/docs/entry/Command/GetScoData.md
  evidence_detail: >-
    GetScoData / PutScoData exchange SCORM-defined cmi.* run-time data-model variables
    (cmi.completion_status, cmi.score.scaled, cmi.score.raw, cmi.score.max, cmi.interactions,
    cmi.total_time) and the docs reference the ADL SCORM Runtime Environment manual. PutScoData
    strips read-only fields and accumulates cmi.total_time as the spec requires.
