name: Agilix Buzz API data model
description: >-
  Entity-relationship graph for the Buzz API, transcribed from the provider's own published
  data-model chart rather than derived from a spec — there is no OpenAPI to derive $ref links
  from. Buzz organizes its objects into six families: School Objects, Static Course Content,
  Dynamic Course Objects, Student Content, Learning Objective Objects and Other Objects. The
  spine is Domain -> Course -> Enrollment: a domain owns everything, a course holds content,
  and an enrollment binds a user to a course for a period with a rights mask. Everything a
  student produces hangs off the enrollment, not the user, which is why a learner who retakes
  a course gets a second enrollment rather than overwritten work.
identifiers:
  primary: Buzz entity id (numeric string)
  external: >-
    Most entities carry a "reference" field holding the id from an external system (typically
    an SIS), and commands accept it in place of the Buzz id.
  domain_path: 'Domains can be addressed by path with a // prefix, e.g. "//myschool".'
  composite: >-
    An item merged with a group override carries a composite actualentityid of
    "{courseId}:{groupId}" so a client can tell an override is in effect.
  see: https://api.agilixbuzz.com/docs/entry/Concept/EntityIds.md
entities:
- name: Domain
  family: school
  description: >-
    Root-most owner of every other object. Typically an institution (district, school) but can
    act as a course repository. Domains nest; rights in a parent apply to all descendants.
  commands: [CreateDomains, GetDomain2, UpdateDomains, DeleteDomain, RestoreDomain]
  schema: https://api.agilixbuzz.com/docs/entry/Schema/Domain.md
  relationships:
  - has_many: Domain
    via: parent domain
  - has_many: User
  - has_many: Course
  - has_many: Enrollment
  - has_many: Announcement
- name: User
  family: school
  description: A person's account in a domain. Also the shape of an Application Identity (machine) account.
  commands: [CreateUsers2, GetUser2, UpdateUsers, DeleteUsers, RestoreUser, ListUsers]
  schema: https://api.agilixbuzz.com/docs/entry/Schema/User.md
  relationships:
  - belongs_to: Domain
    via: domainid
  - has_many: Enrollment
  - has_many: Right
- name: Right
  family: school
  description: A permission a user holds on an entity; domain rights cascade to descendant domains.
  commands: [UpdateRights, GetRights]
  enum: https://api.agilixbuzz.com/docs/entry/Enum/RightsFlags.md
  relationships:
  - belongs_to: User
  - belongs_to: Domain
- name: Course
  family: school
  description: >-
    Container for learning material. A course can derive from a master course so edits flow to
    derivatives. Grading rules, objectives, categories and course variables live in its data XML.
  commands: [CreateCourses, CopyCourses, GetCourse2, UpdateCourses, DeleteCourses, RestoreCourse, ListCourses]
  schema: https://api.agilixbuzz.com/docs/entry/Schema/Course.md
  relationships:
  - belongs_to: Domain
  - has_one: Course
    via: base/ancestor course (derivation)
  - has_many: Item
  - has_many: Resource
  - has_many: Enrollment
  - has_many: Group
- name: Enrollment
  family: school
  description: >-
    Binds a user to a course for a period with a course rights mask (student, teacher, TA).
    All student work and grades bind here, not to the user.
  commands: [CreateEnrollments, GetEnrollment3, UpdateEnrollments, DeleteEnrollments, RestoreEnrollment, ListEnrollments]
  schema: https://api.agilixbuzz.com/docs/entry/Schema/Enrollment.md
  relationships:
  - belongs_to: User
    via: userid
  - belongs_to: Course
    via: entityid
  - has_many: Submission
  - has_many: Grade
  - has_one: EnrollmentMetrics
- name: Resource
  family: static-course-content
  description: Raw content files — HTML, PDF, images, video.
  commands: [PutResource, GetResource, DeleteResources, RestoreResources, CopyResources]
  relationships:
