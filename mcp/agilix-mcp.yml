name: Agilix Buzz API — candidate MCP tool surface
description: >-
  Agilix Labs publishes no MCP server. This is a DERIVED candidate tool list, proposed by API
  Evangelist from the provider's own published command reference — nothing here is shipped by
  Agilix and no endpoint below is callable. It is recorded so the gap is legible: Buzz already
  publishes the two things an MCP server is usually built from — a machine-readable
  documentation index (llms.txt, 660 entries, plus an ai-plugin.json manifest on two API hosts
  naming it) and 291 individually documented commands with request and response shapes — but
  no server binds them to tools.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: derived
search:
  checked: '2026-09-12'
  probes:
  - url: https://api.agilixbuzz.com/mcp
    status: 404
  - url: https://api.agilixbuzz.com/.well-known/ai-plugin.json
    status: 200
    note: >-
      An OpenAI-plugin-era manifest, not MCP. auth.type is "none" and it points models at
      llms.txt/llms.md rather than at a tool endpoint.
  registries_and_search:
  - Web search for an Agilix/Buzz MCP server returned nothing first-party.
  - AgilixLabs GitHub org (8 public repos) contains no MCP server; the seven Buzz repos are
    language sample clients and the eighth is an unrelated Rust ACME client.
grounding:
  contract: none
  note: >-
    No OpenAPI exists to bind tools to operationIds, so the candidate tools below are named
    against REAL documented DLAP command names (verified present in
    https://api.agilixbuzz.com/sitemap.xml, which lists 291 /docs/Command/ pages). No input
    schemas are asserted — the provider documents parameters per command page in Markdown
    tables, not in a machine-readable schema, so an implementer would have to transcribe them.
candidate_tools:
