  note: Student work — FERPA-governed. A real server should gate this behind explicit consent.
- tool: buzz_create_users
  commands: [CreateUsers2]
  auth: bearer
  consequence: write
  reversal: DeleteUsers / RestoreUser
- tool: buzz_create_enrollments
  commands: [CreateEnrollments]
  auth: bearer
  consequence: write
  reversal: DeleteEnrollments / RestoreEnrollment
- tool: buzz_put_items
  commands: [PutItems, GetManifest]
  auth: bearer
  consequence: write
  reversal: DeleteItems / RestoreItems
- tool: buzz_configure_data_stream
  commands: [SetDataStreamConfiguration, GetDataStreamConfiguration, ValidateDataStreamConfiguration]
  auth: bearer
  consequence: write
  note: >-
    ValidateDataStreamConfiguration is the one place in this API with a native rehearsal
    operation, which makes it the natural first tool for an agent to be trusted with.
risk_notes:
- The Buzz API documents no idempotency mechanism (conventions/agilix-conventions.yml), so any
  MCP tool wrapping a write must implement its own de-duplication before an agent retries.
- Delete commands are soft deletes with matching Restore commands, but no retention window is
  published, so an agent cannot know how long a reversal remains possible.
